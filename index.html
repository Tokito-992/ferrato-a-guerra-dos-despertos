<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05060a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ferrato" />
  <meta name="application-name" content="FERRATO" />
  <meta name="description" content="Ferrato: A Guerra Dos Despertos — beat 'em up 2D single player em HTML5 Canvas + TypeScript." />
  <title>FERRATO — A Guerra Dos Despertos</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css?v=c5d0d69737a2" />
</head>
<body>
  <div id="app">
    <div id="frame">
      <div id="stage">
        <canvas id="game" width="1280" height="720" aria-label="Jogo Ferrato: A Guerra Dos Despertos"></canvas>
        <div class="crt" aria-hidden="true"></div>
      </div>
    </div>
    <button id="fullscreen-toggle" type="button" aria-label="Tela cheia" title="Tela cheia">⛶</button>
    <div id="loading">
      <div class="loading-mark">FERRATO</div>
      <div class="loading-sub">abrindo o Véu…</div>
    </div>
    <p id="footnote">
      <span>WASD / ← → mover</span><span>ESPAÇO pular</span><span>J atacar</span><span>K pesado</span>
      <span>L dash</span><span>E habilidade</span><span>ESC pausar</span><span>M áudio</span><span>F tela cheia</span>
    </p>
  </div>
  <div id="rotate-hint" aria-hidden="true">
    <div class="rotate-phone" aria-hidden="true"><span></span></div>
    <p>GIRE O DISPOSITIVO</p>
    <span>FERRATO foi feito para o modo horizontal.</span>
  </div>
  <noscript>Este jogo precisa de JavaScript habilitado.</noscript>
  <script type="module" src="dist/main.js?v=c5d0d69737a2"></script>
</body>
</html>
